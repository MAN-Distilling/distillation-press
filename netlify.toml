# Netlify configuration — Distillation Press

[build]
  publish = "."

# Custom 404 page
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Redirect distillationpress.work → distillationpress.quest
[[redirects]]
  from    = "https://distillationpress.work/*"
  to      = "https://distillationpress.quest/:splat"
  status  = 301
  force   = true

# Redirect www → apex
[[redirects]]
  from    = "https://www.distillationpress.quest/*"
  to      = "https://distillationpress.quest/:splat"
  status  = 301
  force   = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
